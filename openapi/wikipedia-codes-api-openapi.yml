components:
  schemas:
    code:
      type: object
      properties:
        identifier:
          type: string
        name:
          type: string
        description:
          type: string
    filter:
      type: object
      properties:
        field:
          type: string
        value:
          type: string
    error:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
